<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Anmelden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
:root { --bg: #fafafa; --surface: #fff; --fg: #09090b; --muted: #71717a; --line: #e4e4e7; --accent: #0f766e; --accent-h: #115e59; --ring: rgba(15,118,110,.18); --bad: #b91c1c; }
@media (prefers-color-scheme: dark) { :root { --bg: #09090b; --surface: #111113; --fg: #fafafa; --muted: #a1a1aa; --line: #27272a; --accent: #2dd4bf; --accent-h: #5eead4; --ring: rgba(45,212,191,.22); --bad: #f87171; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 24px 16px; }
form { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: grid; gap: 14px; box-shadow: 0 1px 2px rgba(9,9,11,.05), 0 12px 32px rgba(9,9,11,.06); }
h1 { font-size: 20px; letter-spacing: -.02em; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 13.5px; }
label { display: grid; gap: 5px; font-size: 12.5px; color: var(--muted); }
input { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
button { font: inherit; font-weight: 500; border: 0; border-radius: 8px; padding: 10px; background: var(--accent); color: #fff; cursor: pointer; }
@media (prefers-color-scheme: dark) { button { color: #042f2e; } }
button:hover { background: var(--accent-h); }
button[disabled] { opacity: .6; cursor: default; }
.err { color: var(--bad); font-size: 13px; min-height: 1.2em; }
.brand { font-weight: 700; letter-spacing: -.03em; font-size: 18px; }
.brand span { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 6px; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="brand">TST<span>Finanz</span></div>
  <h1>Anmelden</h1>
  <p>Klickdummy mit Beispieldaten. Die Zugangsdaten haben Sie per E-Mail erhalten.</p>
  <label>Benutzername<input id="u" name="username" autocomplete="username" required></label>
  <label>Passwort<input id="p" name="password" type="password" autocomplete="current-password" required></label>
  <button id="b" type="submit">Anmelden</button>
  <div class="err" id="e" role="alert"></div>
</form>
